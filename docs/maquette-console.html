<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console du maire</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Mise en page : l'interface d'origine (déroulé · chrono · carte) + les fermes en 4e colonne fixe, tableaux allégés, barre d'actions flottante. */
:root {
  --bg: #F1E4C8; --surface: #fbf3e0; --surface2: #f5e8cc; --line: #dcc9a3; --fg: #2A1D15; --muted: #6d5b49; --sand: #a64e0c;
  --teal: #3a7c66; --teal-ink: #fff; --teal-soft: rgba(75,150,125,.16); --pb: #FF934F; --pc: #E0701F; --ink: #2b1100;
  --bad: #b8283a; --bad-soft: rgba(184,40,58,.12); --warn: #a64e0c; --warn-soft: rgba(224,112,31,.16);
  --shadow: 0 10px 28px -18px rgba(42,29,21,.55); --float: 0 18px 44px -14px rgba(42,29,21,.55);
  --f-display: "Amatic SC", "Segoe UI", sans-serif; --f-body: "Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
}
:root[data-theme="dark"] {
  --bg: #1B1410; --surface: #261b15; --surface2: #30231b; --line: #45342a; --fg: #f3e9d8; --muted: #b9a78f; --sand: #FF934F;
  --teal: #66bb9b; --teal-ink: #05150f; --teal-soft: rgba(102,187,155,.2); --bad: #f2616d; --bad-soft: rgba(242,97,109,.16); --warn: #FF934F; --warn-soft: rgba(255,147,79,.16);
  --shadow: 0 10px 28px -18px rgba(0,0,0,.8); --float: 0 18px 44px -14px rgba(0,0,0,.9); color-scheme: dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1B1410; --surface: #261b15; --surface2: #30231b; --line: #45342a; --fg: #f3e9d8; --muted: #b9a78f; --sand: #FF934F;
  --teal: #66bb9b; --teal-ink: #05150f; --teal-soft: rgba(102,187,155,.2); --bad: #f2616d; --bad-soft: rgba(242,97,109,.16); --warn: #FF934F; --warn-soft: rgba(255,147,79,.16);
  --shadow: 0 10px 28px -18px rgba(0,0,0,.8); --float: 0 18px 44px -14px rgba(0,0,0,.9); color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: radial-gradient(90% 40% at 15% -10%, rgba(75,150,125,.16), transparent 60%), radial-gradient(70% 40% at 100% 0%, rgba(255,147,79,.2), transparent 60%), var(--bg); background-attachment: fixed; color: var(--fg); font-family: var(--f-body); line-height: 1.4; min-height: 100vh; overflow-x: hidden; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; font-family: var(--f-display); font-weight: 700; letter-spacing: .02em; line-height: 1; }
.muted { color: var(--muted); } .num { font-variant-numeric: tabular-nums; }
.eyebrow { font-weight: 800; letter-spacing: .1em; text-transform: uppercase; font-size: 11px; color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .sb { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* ----- Bandeau de la maquette (hors interface) ----- */
.mock { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px 16px; background: #1f1712; color: #f3e9d8; font-size: 13px; }
.mock b { letter-spacing: .08em; text-transform: uppercase; font-size: 11px; color: #ff934f; }
.mock button { border: 1px solid #5a4638; background: #2b2019; color: #f3e9d8; border-radius: 99px; padding: 4px 12px; font-size: 13px; }
.mock button.on { background: #ff934f; color: #2b1100; border-color: transparent; font-weight: 700; }
.mock .sp { flex: 1; }

/* ----- Boutons : une seule forme, icône et texte toujours ensemble, centrés ----- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; white-space: nowrap; line-height: 1; transition: transform .12s, filter .12s; }
.btn:hover { filter: brightness(.97); } .btn:active { transform: translateY(1px); }
.btn.sm { min-height: 34px; padding: 0 11px; gap: 6px; font-size: 13px; border-radius: 10px; }
.btn.primary { background: linear-gradient(135deg, var(--pb), var(--pc)); border-color: transparent; color: var(--ink); box-shadow: 0 12px 26px -14px rgba(224,112,31,.8); }
.btn.good { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn .i { font-size: 15px; line-height: 1; display: inline-block; width: 1.2em; text-align: center; }
.pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 3px 11px; font-size: 12.5px; font-weight: 700; background: var(--surface2); border: 1px solid var(--line); white-space: nowrap; }
.pill.ok { background: var(--teal-soft); color: var(--teal); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 18px; min-width: 0; }
input:not([type=checkbox]), select { min-height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); min-width: 0; }
details > summary { cursor: pointer; color: var(--sand); font-weight: 700; font-size: 14px; list-style: none; min-height: 28px; display: flex; align-items: center; gap: 6px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "›"; display: inline-block; transition: transform .15s; }
details[open] > summary::before { transform: rotate(90deg); }

/* ----- En-tête ----- */
.admin { max-width: 1760px; margin: 0 auto; padding: 18px clamp(14px, 2vw, 28px) 130px; display: flex; flex-direction: column; gap: 16px; }
.hdr { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; }
.logo { width: 48px; height: 48px; border-radius: 15px; background: linear-gradient(135deg, var(--pb), var(--pc)); display: grid; place-items: center; font-size: 26px; box-shadow: 0 12px 26px -14px rgba(224,112,31,.8); }
.brand h1 { font-size: 38px; color: var(--sand); } .brand .logo { width: 42px; height: 42px; font-size: 22px; }
/* Menu déroulant unique, en haut à droite, sur la ligne du titre */
.hdr { position: relative; z-index: 100; }
.menu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 300px; max-width: calc(100vw - 24px); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--float); padding: 6px; display: none; }
.menu.open { display: block; animation: fade .15s ease both; }
.mi { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 40px; padding: 0 12px; border: 0; background: transparent; border-radius: 10px; font-weight: 600; font-size: 14.5px; white-space: nowrap; text-align: left; }
.mi:hover { background: var(--surface2); } .mi .i { width: 1.4em; text-align: center; font-size: 16px; line-height: 1; flex: none; }
.mi small { margin-left: auto; color: var(--muted); font-weight: 500; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
.mrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 12px; font-size: 14.5px; font-weight: 600; }


/* ----- Grille : déroulé · étape (chrono + panneaux de l'étape) · fermes ----- */
.grid { display: grid; grid-template-columns: minmax(230px, 290px) minmax(0, 1fr) 330px; gap: 16px; align-items: start; }
.grid .steps { grid-column: 1; }
.grid .center { grid-column: 2; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.grid .center.wide { grid-column: 1 / span 2; }
.grid .farms { grid-column: 3; grid-row: 1; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; padding-right: 2px; display: flex; flex-direction: column; gap: 10px; }
.panel h2 { font-size: 30px; }
.step { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; border: 1px solid transparent; }
.step.active { border-color: var(--pc); background: var(--warn-soft); } .step.done { opacity: .6; }
.step .n { width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: var(--surface2); border: 1px solid var(--line); }
.step.active .n { background: var(--pc); color: var(--ink); border-color: transparent; } .step.done .n { background: var(--teal); color: var(--teal-ink); border-color: transparent; }
.step small { display: block; color: var(--muted); font-size: 12.5px; } .step .say { font-size: 13px; color: var(--sand); margin-top: 4px; }
.clock { font-weight: 800; font-size: clamp(40px, 4.5vw, 64px); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.clock.low { color: var(--bad); }
.bar { height: 12px; border-radius: 99px; background: var(--surface2); overflow: hidden; } .bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, var(--pb), var(--pc)); }
.cardshow { display: flex; gap: 16px; align-items: center; } .cardshow .ico { font-size: 72px; line-height: 1; }
.cardshow h3 { font: 800 28px/1.1 var(--f-body); letter-spacing: 0; margin: 6px 0; }
.chip { display: inline-flex; gap: 6px; align-items: center; border-radius: 99px; border: 1px solid var(--line); padding: 3px 10px; font-size: 13px; background: var(--surface2); }
.die { width: 34px; height: 34px; border-radius: 10px; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-weight: 800; } .die.fail { background: var(--bad); color: #fff; }

/* ----- Tableaux épurés : pas de cases, un filet léger, le texte respire ----- */
table.t { width: 100%; border-collapse: collapse; }
table.t th { text-align: left; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 800; padding: 0 10px 8px 0; border-bottom: 1px solid var(--line); }
table.t td { padding: 11px 10px 11px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); vertical-align: middle; font-size: 14.5px; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.r, table.t th.r { text-align: right; padding-right: 0; }
.big { font-size: 24px; font-weight: 800; line-height: 1; } .sub { color: var(--muted); font-size: 12.5px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; }
.ok-t { color: var(--teal); font-weight: 700; } .warn-t { color: var(--warn); font-weight: 700; } .bad-t { color: var(--bad); font-weight: 700; }
.clk { display: inline-block; min-width: 58px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; border-radius: 10px; border: 2px solid var(--teal); padding: 3px 8px; }

/* ----- Colonne des fermes ----- */
.farm { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 14px; display: grid; gap: 8px; }
.farm.attn { border-color: var(--pc); }
.farm .nm { font-weight: 800; display: flex; align-items: center; gap: 7px; }
.stress { display: flex; gap: 3px; } .stress i { flex: 1; height: 7px; border-radius: 99px; background: var(--line); }
.stress i.z { background: var(--teal); } .stress i.a { background: var(--pb); } .stress i.s { background: var(--bad); }
.gage { font-size: 12.5px; display: flex; gap: 8px; align-items: flex-start; background: var(--surface2); border-radius: 10px; padding: 6px 8px; }
.drawer { display: grid; gap: 10px; margin-top: 8px; padding: 10px; border-radius: 12px; background: var(--surface2); font-size: 13.5px; }
.fix { display: flex; flex-wrap: wrap; gap: 6px; }
.seg { display: inline-flex; background: var(--surface2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 4px 11px; font-weight: 700; font-size: 13px; color: var(--muted); } .seg button.on { background: var(--surface); color: var(--sand); box-shadow: var(--shadow); }

/* ----- Barre d'actions flottante : toujours à l'écran, sans descendre en bas de page ----- */
.dock { position: fixed; left: calc((100vw - 346px) / 2 + 12px); bottom: 16px; transform: translateX(-50%); z-index: 50; width: min(900px, calc(100vw - 346px - 24px)); display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 18px; border-radius: 22px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); border: 1px solid var(--line); box-shadow: var(--float); }
.dock .txt { flex: 1; min-width: 0; } .dock .txt b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .dock .txt span { font-size: 13px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock .go { min-height: 48px; padding: 0 24px; font-size: 15px; }
.dock .pulse { animation: pulse 1.8s infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(224,112,31,.5); } 50% { box-shadow: 0 0 0 10px rgba(224,112,31,0); } }
.veil { position: fixed; inset: 0; z-index: 300; background: rgba(20,12,6,.5); backdrop-filter: blur(3px); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 14px; overflow: auto; }
.sheet { width: min(640px, 100%); display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 22px; box-shadow: var(--float); }
.sec { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; } .sec h3 { font-size: 24px; }
.opt { display: flex; gap: 10px; align-items: flex-start; } .opt small { display: block; color: var(--muted); }
.fade { animation: fade .3s ease both; }
.noanim .fade { animation: none; } @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

@media (max-width: 1250px) {
  .grid { grid-template-columns: minmax(0, 1fr) 300px; }
  .grid .steps { grid-column: 1; grid-row: 1; } .grid .center, .grid .center.wide { grid-column: 1; grid-row: 2; }
  .grid .farms { grid-column: 2; grid-row: 1 / span 2; }
}
@media (max-width: 1000px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .grid .steps, .grid .center, .grid .center.wide, .grid .farms { grid-column: 1; grid-row: auto; position: static; max-height: none; overflow: visible; }
  .grid .farms { order: 3; }
  .dock { left: 50%; width: calc(100vw - 24px); } .dock .txt span { display: none; } .dock { padding-left: 12px; }
  .panel { overflow-x: auto; } table.t { min-width: 480px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="mock"><b>Maquette</b><span>État de la partie :</span><span id="states" class="row" style="gap:6px"></span><span class="sp"></span><button id="theme">🌙 Mode sombre</button></div>
<div class="admin" id="app"></div>

<script>
(function () {
  var FARMS = [
    { id: 1, name: 'Les Bergers', color: '#8FD36B', bank: 520, stress: 2, ready: true, choice: 'Parade jouée', gage: '🎁 L’équipe choisit la musique de la saison.', gageDone: false, tiles: '2 chèvreries · 1 poulailler · atelier', equip: 'Tracteur, panier ×2', stock: 'Lait 8 · Œufs 3 · Fromage 1', harvest: { lait: 8, oeuf: 3 } },
    { id: 2, name: 'Les Maraîchers', color: '#F2B63D', bank: 610, stress: 5, ready: false, choice: 'Subit l’effet', gage: '🎭 Toute l’équipe annonce ses décisions en rimant.', gageDone: true, tiles: '2 potagers · 1 poulailler', equip: 'Serre, brouette', stock: 'Fruits et légumes 12 · Œufs 2', harvest: { fl: 12, oeuf: 2 } },
    { id: 3, name: 'Les Éleveurs', color: '#F29CB0', bank: 480, stress: 8, ready: false, choice: null, gage: '🎭 L’équipe chante un refrain devant le village.', gageDone: false, tiles: '2 porcheries · 1 chèvrerie', equip: 'Chien de berger', stock: 'Viande 6 · Lait 4', harvest: { viande: 6, lait: 40 } },
    { id: 4, name: 'Les Gourmets', color: '#8EC5F0', bank: 700, stress: 1, ready: true, choice: '+1 stress', gage: '🎁 Le maire félicite la ferme à voix haute.', gageDone: false, tiles: '1 porcherie · 1 potager · atelier', equip: 'Camionnette, table', stock: 'Viande 3 · Fruits et légumes 5', harvest: { viande: 3, fl: 5 } }
  ];
  var PROD = { lait: '🥛 Lait', oeuf: '🥚 Œufs', viande: '🥩 Viande', fl: '🥕 Fruits et légumes' };
  var STEPS = [['Aléa', 'Carte aléa et dés des activités', '0:30', '« Une carte aléa est tirée. Chaque ferme choisit : subir, jouer sa parade ou ajouter 1 stress. »'], ['Récolte en relais', 'Un coureur par tuile, un jeton par trajet', '1:15', '« Coureurs en place… Trois, deux, un, partez ! »'], ['Transformation et bourse', 'Recettes et échanges entre fermes', '1:00', '« Encodez votre récolte, déclarez vos recettes. Ce qui n’est ni vendu ni transformé est perdu. »'], ['Marché', 'Roue de chaque équipe', '1:00', '« Placez vos produits, déclarez, tournez la roue. »'], ['Achats et vacances', 'Matériel, voyages, détente', '0:30', '« Dernière minute : matériel et vacances. Regardez la météo ! »']];
  var S = [
    { id: 'lobby', label: 'Salle d’attente', phase: 'lobby' }, { id: 'setup', label: 'Installation', phase: 'setup' },
    { id: 'alea', label: '1 · Aléa', phase: 'season', step: 0 }, { id: 'colec', label: '1 · Aléa collectif', phase: 'season', step: 0 },
    { id: 'recolte', label: '2 · Récolte', phase: 'season', step: 1 }, { id: 'transfo', label: '3 · Transformation', phase: 'season', step: 2 },
    { id: 'marche', label: '4 · Marché', phase: 'season', step: 3 }, { id: 'achats', label: '5 · Achats', phase: 'season', step: 4 },
    { id: 'cloture', label: 'Clôture et fête', phase: 'closing' }
  ];
  var cur = 4, secs = 24, running = true, settingsOpen = false, menuOpen = false, jumpOpen = false, animNext = true, view = 'cards';
  var app = document.getElementById('app');
  var fmt = function (n) { return Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0'); };
  var lvl = function (n) { return n < 4 ? ['Zen', 'z', 'ok'] : n < 7 ? ['Agité', 'a', 'warn'] : ['Stressé', 's', 'bad']; };
  var btn = function (ico, label, cls) { return '<button class="btn ' + (cls || '') + '"><span class="i">' + ico + '</span>' + label + '</button>'; };
  var sm = function (label, cls) { return '<button class="btn sm ' + (cls || '') + '">' + label + '</button>'; };

  /* ---------- Fermes : 4e colonne ---------- */
  function farmStatus(f) {
    var id = S[cur].id;
    if (id === 'alea') return f.choice ? ['ok', '✓ ' + f.choice] : ['warn', 'Choix en attente'];
    if (id === 'colec') return f.id === 1 ? ['ok', 'A donné 4'] : ['', 'N’a pas donné'];
    if (id === 'recolte') return f.id < 3 ? ['ok', '✓ Récolte encodée'] : ['warn', 'En course…'];
    if (id === 'transfo') return f.id === 2 ? ['warn', 'Jetons à échanger'] : ['ok', '✓ Recettes traitées'];
    if (id === 'marche') return f.id === 1 ? ['ok', '✓ Payée'] : f.id === 2 ? ['warn', 'À payer · 56 EB'] : ['', 'Roue à tourner'];
    if (id === 'achats') return f.ready ? ['ok', '✓ Prête'] : ['', 'À la boutique'];
    if (id === 'cloture') return f.id === 3 ? ['bad', '1 plat à livrer'] : ['ok', '✓ Plats livrés'];
    if (id === 'setup') return f.ready ? ['ok', '✓ Prête'] : ['warn', 'Installe sa ferme'];
    return ['ok', 'Ferme prise'];
  }
  var stressBar = function (f) { var L = lvl(f.stress), h = ''; for (var i = 0; i < 10; i++) h += '<i class="' + (i < f.stress ? L[1] : '') + '"></i>'; return '<div class="stress">' + h + '</div>'; };
  var harvestFix = function (f) { return Object.keys(f.harvest).map(function (k) { return '<div class="row" style="gap:6px"><span style="min-width:140px">' + PROD[k] + '</span>' + sm('−') + '<b class="num" style="min-width:26px;text-align:center">' + f.harvest[k] + '</b>' + sm('+') + (f.harvest[k] > 30 ? '<span class="pill bad">⚠ à vérifier</span>' : '') + '</div>'; }).join(''); };
  function drawer(f) {
    var st = S[cur].step;
    return '<div class="drawer"><div class="row"><input placeholder="± montant" style="width:92px"><input placeholder="Motif" style="width:110px">' + sm('Banque') + sm('−1 stress') + sm('+1 stress') + '</div><div>📦 ' + f.stock + '</div>' +
      (st === 1 || st === 2 ? '<div>' + harvestFix(f) + '</div>' : '') + '<div class="sub">' + f.tiles + ' · ' + f.equip + '</div>' +
      '<div class="fix"><select><option>Chèvrerie</option><option>Poulailler</option><option>Atelier</option></select>' + sm('Tuile gratuite') + sm(f.ready ? '✓ Prête' : 'Marquer prête', f.ready ? 'good' : '') + (st === 3 ? sm('🎡 Tourner la roue') : '') + sm('🔓 Libérer') + '</div></div>';
  }
  function farmCard(f) {
    var st = farmStatus(f), L = lvl(f.stress);
    return '<article class="farm fade' + (st[0] === 'warn' ? ' attn' : '') + '"><div class="row sb"><span class="nm"><span class="dot" style="background:' + f.color + ';margin:0"></span>' + f.name + '</span><span class="pill ' + st[0] + '">' + st[1] + '</span></div>' +
      '<div class="row sb"><b class="num">💰 ' + f.bank + ' EB</b><span class="pill ' + L[2] + '">' + L[0] + ' · ' + f.stress + '/10</span></div>' + stressBar(f) +

    var farms = tableMode ? '' : farmsCol();
    if (s.phase === 'season') {
      body = '<div class="grid"><div class="steps" style="display:flex;flex-direction:column;gap:16px;min-width:0">' + stepsPanel() + activitiesPanel() + '</div><div class="center">' + timerPanel(STEPS[s.step][0], '', {0: '3 sur 4 ont choisi', 1: '2 sur 4 ont encodé', 2: '1 demande en attente', 3: '2 à payer', 4: '2 fermes prêtes'}[s.step]) + sidePanel() + below() + '</div>' + farms + '</div>' + (tableMode ? farmTable() : '');
    } else if (s.phase === 'lobby') body = '<div class="grid"><div class="center wide">' + lobbyPage() + '</div>' + farms + '</div>';
    else if (s.phase === 'setup') body = '<div class="grid"><div class="center wide">' + setupPage() + '</div>' + farms + '</div>';
    else body = '<div class="grid"><div class="center wide">' + cloturePage() + '</div>' + farms + '</div>';
    app.innerHTML = header() + body + dock() + settings();
    app.classList.toggle('noanim', !animNext); animNext = false;
    paintClock();
  }
  function paintClock() { var c = document.getElementById('clock'), b = document.getElementById('bar'); if (c) { c.textContent = fmt(secs); c.classList.toggle('low', secs <= 10); } if (b) b.style.width = Math.round(secs / 60 * 100) + '%'; }

  var statesEl = document.getElementById('states');
  S.forEach(function (s, i) { var b = document.createElement('button'); b.textContent = s.label; b.onclick = function () { go(i); }; statesEl.appendChild(b); });
  function go(i) { cur = Math.max(0, Math.min(S.length - 1, i)); secs = 24; menuOpen = false; jumpOpen = false; animNext = true; sync(); }
  function sync() { Array.prototype.forEach.call(statesEl.children, function (b, i) { b.classList.toggle('on', i === cur); }); render(); }
  document.addEventListener('click', function (e) {
    var t = e.target, vv = t.closest('[data-view]');
    if (vv) { view = vv.dataset.view; return render(); }
    if (t.closest('#menubtn')) { menuOpen = !menuOpen; return render(); }
    if (t.closest('#gear')) { settingsOpen = true; menuOpen = false; return render(); }
    if (t.closest('#jumpbtn')) { jumpOpen = !jumpOpen; menuOpen = false; return render(); }
    if (jumpOpen && !t.closest('.menu')) { jumpOpen = false; render(); }
    if (menuOpen && !t.closest('.menu')) { menuOpen = false; render(); }
    if (t.closest('#closeSettings') || t.id === 'veil') { settingsOpen = false; return render(); }
    if (t.closest('#runbtn')) { running = !running; return render(); }
    if (t.closest('#go')) return go(cur + 1);
    if (t.closest('#prev')) return go(cur - 1);
  });
  document.addEventListener('keydown', function (e) {
    if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'Escape') { settingsOpen = false; menuOpen = false; render(); }
    if (e.code === 'Space') { e.preventDefault(); running = !running; render(); }
    if (e.key === 'ArrowRight') go(cur + 1); if (e.key === 'ArrowLeft') go(cur - 1);
  });
  setInterval(function () { if (running && secs > 0 && S[cur].phase !== 'lobby') { secs--; paintClock(); } }, 1000);
  var themeBtn = document.getElementById('theme');
  themeBtn.onclick = function () { var dark = document.documentElement.dataset.theme !== 'dark'; document.documentElement.dataset.theme = dark ? 'dark' : 'light'; themeBtn.textContent = dark ? '☀️ Mode clair' : '🌙 Mode sombre'; };
  if (!document.documentElement.dataset.theme && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) themeBtn.click();
  sync();
})();
</script>
</body>
</html>
