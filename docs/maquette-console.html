<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette · Console du maire du village</title>
<style>
/* ---------- Jetons de design (parchemin / cuir, mêmes couleurs que le jeu) ---------- */
:root {
  --bg: #f4ead3; --bg2: #efe1c2; --card: #fffaf0; --card2: #f8eed8; --line: #e3d3ae; --ink: #2a1d15; --muted: #7a6853;
  --accent: #e0701f; --accent2: #ff934f; --accent-ink: #2b1100; --teal: #3a7c66; --teal-soft: rgba(58,124,102,.14); --bad: #b8283a; --bad-soft: rgba(184,40,58,.12);
  --warn: #a64e0c; --warn-soft: rgba(224,112,31,.14); --shadow: 0 1px 2px rgba(42,29,21,.06), 0 12px 32px -16px rgba(42,29,21,.35);
  --r: 20px; --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --f-display: "Amatic SC", var(--f-body);
}
:root[data-theme="dark"] {
  --bg: #1a130f; --bg2: #21170f; --card: #2a1d15; --card2: #33241a; --line: #46342a; --ink: #f3e9d8; --muted: #b9a78f;
  --accent: #ff934f; --accent2: #e0701f; --accent-ink: #2b1100; --teal: #66bb9b; --teal-soft: rgba(102,187,155,.16); --bad: #f2616d; --bad-soft: rgba(242,97,109,.16);
  --warn: #ff934f; --warn-soft: rgba(255,147,79,.16); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 34px -18px rgba(0,0,0,.8);
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: hidden; }
body { background: radial-gradient(80% 40% at 10% -10%, rgba(58,124,102,.14), transparent 60%), radial-gradient(70% 40% at 100% 0%, rgba(255,147,79,.18), transparent 60%), var(--bg); background-attachment: fixed; color: var(--ink); font-family: var(--f-body); line-height: 1.4; min-height: 100vh; }
button { font: inherit; color: inherit; cursor: pointer; }
.mut { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Bandeau « maquette » (hors interface) ---------- */
.mock { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 8px 16px; background: #1f1712; color: #f3e9d8; font-size: 13px; }
.mock b { letter-spacing: .08em; text-transform: uppercase; font-size: 11px; color: #ff934f; }
.mock button { border: 1px solid #5a4638; background: #2b2019; color: #f3e9d8; border-radius: 99px; padding: 4px 12px; font-size: 13px; }
.mock button.on { background: #ff934f; color: #2b1100; border-color: transparent; font-weight: 700; }
.mock .sp { flex: 1; }

/* ---------- Structure : barre haute, scène, dock d'action ---------- */
.app { width: 100%; display: grid; grid-template-rows: auto 1fr auto; min-height: calc(100vh - 42px); max-width: 1480px; margin: 0 auto; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 12px clamp(14px, 3vw, 28px); background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, var(--accent2), var(--accent)); display: grid; place-items: center; font-size: 20px; box-shadow: 0 8px 18px -10px rgba(224,112,31,.9); flex: none; }
.brand h1 { margin: 0; font: 700 28px/1 var(--f-display); letter-spacing: .02em; color: var(--accent); white-space: nowrap; }
.code { font-weight: 800; letter-spacing: .18em; font-size: 13px; background: var(--card2); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; }
.rail { flex: 1 1 0; min-width: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; }
.rail button { border: 0; background: transparent; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px; color: var(--muted); font-weight: 600; font-size: 14px; white-space: nowrap; transition: background .2s, color .2s; }
.rail button .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--card2); border: 1px solid var(--line); transition: all .2s; }
.rail button.done .dot { background: var(--teal); color: #fff; border-color: transparent; }
.rail button.now { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.rail button.now .dot { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.rail .bar { width: clamp(8px, 2vw, 26px); height: 2px; background: var(--line); border-radius: 2px; }
.tools { display: flex; align-items: center; gap: 6px; flex: none; }
.icon { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; font-size: 18px; position: relative; transition: transform .15s; }
.icon:hover { transform: translateY(-1px); }
.icon.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.menu { position: fixed; right: clamp(10px, 3vw, 28px); top: 66px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 6px; min-width: 230px; display: none; z-index: 200; }
.menu.open { display: block; }
.menu button { display: flex; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; }
.menu button:hover { background: var(--card2); }

.stage { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); gap: clamp(14px, 2vw, 24px); padding: clamp(14px, 2.4vw, 28px); align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: clamp(16px, 2vw, 24px); min-width: 0; }
.card h2 { margin: 0; font: 700 30px/1 var(--f-display); letter-spacing: .02em; }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sb { justify-content: space-between; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 3px 11px; font-size: 12.5px; font-weight: 700; background: var(--card2); border: 1px solid var(--line); white-space: nowrap; }
.pill.ok { background: var(--teal-soft); color: var(--teal); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 9px 16px; font-weight: 700; font-size: 14px; transition: transform .12s, box-shadow .2s, filter .2s; }
.btn:hover { transform: translateY(-1px); filter: brightness(.98); }
.btn.sm { padding: 5px 11px; font-size: 13px; border-radius: 11px; }
.btn.primary { background: linear-gradient(135deg, var(--accent2), var(--accent)); color: var(--accent-ink); border-color: transparent; box-shadow: 0 12px 26px -14px rgba(224,112,31,.9); }
.btn.good { background: var(--teal); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; }

/* ---------- Scène : « Maintenant » ---------- */
.hero { position: relative; z-index: 6; display: grid; gap: 18px; background: linear-gradient(160deg, var(--card), var(--card2)); }
.hero .big { font: 800 clamp(72px, 11vw, 132px)/0.95 var(--f-body); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.hero .big.low { color: var(--bad); }
.progress { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; width: 70%; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 99px; transition: width .6s linear; }
.say { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-soft); border-radius: 14px; padding: 10px 14px; font-size: 14.5px; }
.say .q { font-size: 20px; line-height: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.checks { display: grid; gap: 6px; }
.check { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--card2); font-size: 14.5px; }
.check .b { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; flex: none; }
.check.done { opacity: .65; } .check.done .b { background: var(--teal); border-color: transparent; color: #fff; }

.cardshow { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
.cardshow .ico { font-size: clamp(70px, 9vw, 120px); line-height: 1; filter: drop-shadow(0 12px 20px rgba(0,0,0,.25)); }
.cardshow h3 { margin: 4px 0 6px; font: 800 clamp(30px, 3.6vw, 44px)/1.05 var(--f-body); }
.dice { display: flex; gap: 8px; }
.die { width: 38px; height: 38px; border-radius: 11px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 800; }
.die.fail { background: var(--bad); color: #fff; }

table { border-collapse: separate; border-spacing: 0 8px; width: 100%; }
th { text-align: left; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0 12px; font-weight: 800; }
td { background: var(--card2); padding: 10px 12px; vertical-align: middle; }
td:first-child { border-radius: 14px 0 0 14px; } td:last-child { border-radius: 0 14px 14px 0; }
.clock { font-weight: 800; font-variant-numeric: tabular-nums; border-radius: 12px; padding: 5px 10px; background: var(--card); border: 1px solid var(--line); display: inline-block; min-width: 64px; text-align: center; }
.clock.go { outline: 2px solid var(--teal); }
.token { font-size: 26px; font-weight: 800; line-height: 1; }

/* ---------- Colonne des fermes ---------- */
.farm { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); transition: transform .2s, border-color .2s; }
.farm:hover { transform: translateY(-2px); }
.farm.attn { border-color: var(--accent); }
.farm .name { font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.farm .sw { width: 10px; height: 10px; border-radius: 50%; }
.stress { display: flex; gap: 3px; }
.stress i { flex: 1; height: 8px; border-radius: 99px; background: var(--line); }
.stress i.on.z { background: var(--teal); } .stress i.on.a { background: var(--accent2); } .stress i.on.s { background: var(--bad); }
.farm details summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--accent); list-style: none; }
.farm details summary::-webkit-details-summary { display: none; }
.fix { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.gage { font-size: 13px; background: var(--card2); border-radius: 10px; padding: 6px 10px; display: flex; gap: 8px; align-items: flex-start; }

/* ---------- Panneaux flottants (paramètres) : toujours au premier plan ---------- */
.veil { position: fixed; inset: 0; z-index: 150; background: rgba(20,12,6,.5); backdrop-filter: blur(3px); display: flex; align-items: flex-start; justify-content: center; padding: clamp(12px, 5vh, 56px) 14px; overflow: auto; animation: fade .2s ease both; }
.sheet { width: min(640px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.6); padding: clamp(16px, 3vw, 28px); display: grid; gap: 16px; }
.sheet h3 { margin: 0; font: 700 26px/1 var(--f-display); }
.sec { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.opt { display: flex; gap: 12px; align-items: flex-start; }
.opt small { display: block; color: var(--muted); font-weight: 500; }
.switch { appearance: none; width: 46px; height: 28px; border-radius: 99px; background: var(--line); position: relative; flex: none; cursor: pointer; transition: background .2s; border: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 2px 4px rgba(0,0,0,.3); }
.switch:checked { background: var(--teal); } .switch:checked::after { transform: translateX(18px); }
select { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 8px 12px; }

/* ---------- Dock d'action (une action principale, toujours à portée) ---------- */
.dock { position: sticky; bottom: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 12px clamp(14px, 3vw, 28px) calc(12px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
.dock .next { flex: 1; min-width: 0; }
.dock .next b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock .go { min-height: 52px; padding: 0 28px; font-size: 16px; white-space: nowrap; flex: none; max-width: 60vw; overflow: hidden; text-overflow: ellipsis; }
.dock .go.pulse { animation: pulse 1.8s infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(224,112,31,.5), 0 12px 26px -14px rgba(224,112,31,.9); } 50% { box-shadow: 0 0 0 10px rgba(224,112,31,0), 0 12px 26px -14px rgba(224,112,31,.9); } }
kbd { font: 700 11px var(--f-body); background: var(--card2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; }

.fade { animation: fade .35s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

@media (max-width: 1000px) {
  .stage { grid-template-columns: minmax(0, 1fr); }
  .card { overflow-x: auto; }
  .rail { overflow: hidden; justify-content: flex-start; } .rail .bar { display: none; }
  .dock kbd, .dock span[title] { display: none; }
  .rail button span.lbl { display: none; } .rail button.now span.lbl { display: inline; }
  .brand h1 { display: none; }
}
@media (max-width: 560px) {
  .dock .next { display: none; } .dock .go { padding: 0 18px; flex: 1; max-width: none; }
  .cardshow { grid-template-columns: 1fr; }
  .tools .icon.opt { display: none; }
  .top { gap: 8px; } .code { display: none; } .rail button { padding: 4px 6px; } .rail button:not(.now) .dot { width: 18px; height: 18px; }
  table { min-width: 460px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Niveau 3 : tiroirs, panneaux flottants, bascule Cartes / Tableau ---------- */
.drawer { display: grid; gap: 12px; margin-top: 10px; padding: 12px; border-radius: 14px; background: var(--card2); }
.g2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
input:not([type=checkbox]) { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 6px 10px; min-width: 0; }
.pop { position: absolute; left: 0; top: calc(100% + 8px); z-index: 120; width: min(360px, 86vw); background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 14px; }
.seg { display: inline-flex; background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 5px 12px; font-weight: 700; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.stage.tbl { grid-template-columns: minmax(0, 1fr); }
.checks { display: grid; gap: 6px; }
.nw { white-space: nowrap; }
summary { list-style: none; } summary::-webkit-details-marker { display: none; }
.card > summary, details.card > summary { list-style: none; }
.btn.opt { display: inline-flex; }
@media (max-width: 1100px) { .btn.opt { display: none; } }
</style>
</head>
<body>

<div class="mock">
  <b>Maquette</b><span class="mut">État de la partie :</span>
  <span id="states" class="row" style="gap:6px"></span>
  <span class="sp"></span>
  <button id="theme">🌙 Mode sombre</button>
</div>

<div class="app" id="app"></div>

<script>
(function () {
  /* Maquette : même contrôles que la console actuelle, rangés par niveau.
     Niveau 1 = toujours visible (état, action principale) · niveau 2 = panneau de l'étape · niveau 3 = tiroirs (corrections) · niveau 4 = vue Tableau dense. */
  var FARMS = [
    { id: 1, name: 'Les Bergers', color: '#8FD36B', bank: 520, stress: 2, ready: true, choice: 'Parade jouée', gage: '🎁 L’équipe choisit la musique de la saison.', gageDone: false, tiles: '2 chèvreries · 1 poulailler · atelier', equip: 'Tracteur, panier ×2', stock: 'Lait 8 · Œufs 3 · Fromage 1', harvest: { lait: 8, oeuf: 3 }, wheel: 'Tout vendu', taken: true },
    { id: 2, name: 'Les Maraîchers', color: '#F2B63D', bank: 610, stress: 5, ready: false, choice: 'Subit l’effet', gage: '🎭 Toute l’équipe annonce ses décisions en rimant.', gageDone: true, tiles: '2 potagers · 1 poulailler', equip: 'Serre, brouette', stock: 'Fruits et légumes 12 · Œufs 2', harvest: { fl: 12, oeuf: 2 }, wheel: 'Trois quarts', taken: true },
    { id: 3, name: 'Les Éleveurs', color: '#F29CB0', bank: 480, stress: 8, ready: false, choice: null, gage: '🎭 L’équipe chante un refrain devant tout le village.', gageDone: false, tiles: '2 porcheries · 1 chèvrerie', equip: 'Chien de berger', stock: 'Viande 6 · Lait 4', harvest: { viande: 6, lait: 40 }, wheel: null, taken: true },
    { id: 4, name: 'Les Gourmets', color: '#8EC5F0', bank: 700, stress: 1, ready: true, choice: '+1 stress', gage: '🎁 Le maire félicite la ferme à voix haute.', gageDone: false, tiles: '1 porcherie · 1 potager · atelier', equip: 'Camionnette, table', stock: 'Viande 3 · Fruits et légumes 5', harvest: { viande: 3, fl: 5 }, wheel: null, taken: true }
  ];
  var PROD = { lait: '🥛 Lait', oeuf: '🥚 Œufs', viande: '🥩 Viande', fl: '🥕 Fruits et légumes' };
  var STEPS = [['🎴', 'Aléa'], ['🧺', 'Récolte'], ['🍳', 'Transformation'], ['🏪', 'Marché'], ['🛒', 'Achats']];
  var S = [
    { id: 'lobby', label: 'Salle d’attente', phase: 'lobby' },
    { id: 'setup', label: 'Installation', phase: 'setup' },
    { id: 'alea', label: '1 · Aléa', phase: 'season', step: 0 },
    { id: 'colec', label: '1 · Aléa collectif', phase: 'season', step: 0 },
    { id: 'recolte', label: '2 · Récolte', phase: 'season', step: 1 },
    { id: 'transfo', label: '3 · Transformation', phase: 'season', step: 2 },
    { id: 'marche', label: '4 · Marché', phase: 'season', step: 3 },
    { id: 'achats', label: '5 · Achats', phase: 'season', step: 4 },
    { id: 'cloture', label: 'Clôture et fête', phase: 'closing' }
  ];
  var cur = 2, secs = 24, running = true, menuOpen = false, settingsOpen = false, view = 'cards', pop = null;
  var app = document.getElementById('app');
  var fmt = function (n) { return Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0'); };
  var lvl = function (n) { return n < 4 ? ['Zen', 'z', 'ok'] : n < 7 ? ['Agité', 'a', 'warn'] : ['Stressé', 's', 'bad']; };
  var isSeason = function () { return S[cur].phase === 'season'; };

  /* ---------- État de chaque ferme à l'étape courante ---------- */
  function farmStatus(f) {
    var id = S[cur].id;
    if (id === 'alea') return f.choice ? ['ok', '✓ ' + f.choice] : ['warn', 'Choix en attente'];
    if (id === 'colec') return f.id === 1 ? ['ok', 'A donné 20'] : ['', 'N’a pas donné'];
    if (id === 'recolte') return f.id < 3 ? ['ok', '✓ Récolte encodée'] : ['warn', 'En course…'];
    if (id === 'transfo') return f.id === 2 ? ['warn', 'Jetons à échanger'] : ['ok', '✓ Recettes traitées'];
    if (id === 'marche') return f.id === 1 ? ['ok', '✓ Payée'] : f.id === 2 ? ['warn', 'À payer · 56 EB'] : ['', 'Roue à tourner'];
    if (id === 'achats') return f.ready ? ['ok', '✓ Prête'] : ['', 'Dans la boutique'];
    if (id === 'cloture') return f.id === 3 ? ['bad', '1 plat à livrer'] : ['ok', '✓ Plats livrés'];
    if (id === 'setup') return f.ready ? ['ok', '✓ Prête'] : ['warn', 'Installe sa ferme'];
    return ['ok', f.taken ? 'Ferme prise' : 'Libre'];
  }
  var stressBar = function (f) { var L = lvl(f.stress), h = ''; for (var i = 0; i < 10; i++) h += '<i class="' + (i < f.stress ? 'on ' + L[1] : '') + '"></i>'; return '<div class="stress" aria-label="' + f.stress + ' points de stress sur 10">' + h + '</div>'; };
  var gageLine = function (f) { return isSeason() && f.gage ? '<div class="gage"><span>' + f.gage + '</span><button class="btn sm ' + (f.gageDone ? 'good' : '') + '" style="margin-left:auto">' + (f.gageDone ? '✓ Fait' : 'Fait ?') + '</button></div>' : ''; };

  /* ---------- Tiroir complet d'une ferme (niveau 3) : toutes les corrections actuelles ---------- */
  function harvestFix(f) {
    return Object.keys(f.harvest).map(function (k) {
      var odd = f.harvest[k] > 30;
      return '<div class="row" style="gap:6px"><span style="min-width:150px">' + PROD[k] + '</span><button class="btn sm">−</button><b class="num" style="min-width:28px;text-align:center">' + f.harvest[k] + '</b><button class="btn sm">+</button>' + (odd ? '<span class="pill bad" title="Plus de jetons que ses coureurs ne pouvaient en rapporter">⚠ à vérifier</span>' : '') + '</div>';
    }).join('');
  }
  function drawer(f) {
    return '<div class="drawer"><div class="g2"><div><div class="eyebrow">Banque</div><div class="row"><input placeholder="± montant" style="width:96px"><input placeholder="Motif" style="width:120px"><button class="btn sm">Valider</button></div></div>' +

    return '<header class="top"><div class="brand"><div class="logo">🚜</div><h1>Farming’s Folies</h1><span class="code">QWXY</span></div><nav class="rail" aria-label="Étapes">' + rail + '</nav>' +
      '<div class="tools"><button class="icon opt" title="Écran des joueurs">📺</button><button class="icon opt" title="QR code">📱</button><button class="btn sm opt" title="Annule la dernière correction (impossible dès qu’une ferme a joué)">↶ Annuler : banque</button><span style="position:relative"><button class="icon" id="navbtn" title="Aller à une saison">🧭</button>' + nav + '</span><button class="icon" id="gear" title="Paramètres de la partie">⚙️</button>' +
      '<button class="icon" id="more" title="Plus">⋯</button><div class="menu' + (menuOpen ? ' open' : '') + '"><button>📜 Journal</button><button>📖 Règles</button><button>🧭 Guide</button><button>🎯 Objectifs à l’écran</button><button>← Mes parties</button></div></div></header>';
  }

  function settings() {
    if (!settingsOpen) return '';
    var lobbyOnly = S[cur].phase === 'lobby';
    var sw = function (label, hint, on, dis) { return '<label class="opt"><input type="checkbox" class="switch"' + (on ? ' checked' : '') + (dis ? ' disabled' : '') + '><span><b>' + label + '</b><small>' + hint + '</small></span></label>'; };
    return '<div class="veil" id="veil"><section class="sheet" role="dialog" aria-label="Paramètres de la partie"><div class="row sb"><h2 style="font:700 34px/1 var(--f-display);margin:0">⚙️ Paramètres de la partie</h2><button class="btn sm" id="closeSettings">Fermer</button></div>' +
      '<div class="sec"><h3>👥 Équipes et durée</h3><div class="row"><select' + (lobbyOnly ? '' : ' disabled') + '><option>5 joueurs par ferme</option></select><select' + (lobbyOnly ? '' : ' disabled') + '><option>3 ans · partie normale</option></select></div>' + (lobbyOnly ? '' : '<small class="mut">Réglable seulement dans la salle d’attente.</small>') + '</div>' +
      '<div class="sec"><h3>🎲 Options de jeu</h3>' + sw('Défi de saison « zéro perte »', 'Salle d’attente seulement.', false, !lobbyOnly) + sw('Bilan de saison au projecteur', 'Modifiable à tout moment.', true) + sw('Gages selon le niveau de stress', 'Sans effet sur les règles. Les gages se rédigent dans les Réglages de l’accueil.', true) + '</div>' +
      '<div class="sec"><h3>📺 Écran des joueurs</h3><div class="row"><button class="btn sm">📱 Afficher le QR code</button><button class="btn sm">🎯 Afficher les objectifs</button></div></div></section></div>';
  }

  function render() {
    var tableMode = view === 'table';
    var seg = '<div class="seg"><button data-view="cards" class="' + (!tableMode ? 'on' : '') + '">Cartes</button><button data-view="table" class="' + (tableMode ? 'on' : '') + '">Tableau</button></div>';
    var farms = '<div class="row sb"><b>Les fermes</b>' + seg + '</div>' + (tableMode ? '' : FARMS.map(farmCard).join(''));
    app.innerHTML = top() + '<main class="stage' + (tableMode ? ' tbl' : '') + '"><div class="col">' + stageHtml() + '</div><aside class="col">' + farms + (tableMode ? farmTable() : '') + '</aside></main>' + dock() + settings();
    paintClock();
  }
  function paintClock() {
    var c = document.getElementById('clock'), b = document.getElementById('bar');
    if (c) { c.textContent = fmt(secs); c.classList.toggle('low', secs <= 10); }
    if (b) b.style.width = Math.round(secs / 60 * 100) + '%';
  }

  var statesEl = document.getElementById('states');
  S.forEach(function (s, i) { var b = document.createElement('button'); b.textContent = s.label; b.onclick = function () { go(i); }; statesEl.appendChild(b); });
  function go(i) { cur = Math.max(0, Math.min(S.length - 1, i)); secs = 24; menuOpen = false; pop = null; sync(); }
  function sync() { Array.prototype.forEach.call(statesEl.children, function (b, i) { b.classList.toggle('on', i === cur); }); render(); }

  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.closest('[data-view]')) { view = t.closest('[data-view]').dataset.view; return render(); }
    if (t.id === 'gear') { settingsOpen = true; menuOpen = false; pop = null; return render(); }
    if (t.id === 'closeSettings' || t.id === 'veil') { settingsOpen = false; return render(); }
    if (t.id === 'more') { menuOpen = !menuOpen; pop = null; return render(); }
    if (t.id === 'chronoPop') { pop = pop === 'chrono' ? null : 'chrono'; return render(); }
    if (t.id === 'navbtn') { pop = pop === 'nav' ? null : 'nav'; return render(); }
    if (t.id === 'runbtn') { running = !running; return render(); }
    if ((menuOpen || pop) && !t.closest('.menu, .pop')) { menuOpen = false; pop = null; render(); }
    if (t.id === 'go') return go(cur + 1);
    if (t.id === 'prev') return go(cur - 1);
  });
  document.addEventListener('keydown', function (e) {
    if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'Escape') { settingsOpen = false; menuOpen = false; pop = null; render(); }
    if (e.code === 'Space') { e.preventDefault(); running = !running; render(); }
    if (e.key === 'ArrowRight') go(cur + 1);
    if (e.key === 'ArrowLeft') go(cur - 1);
  });
  setInterval(function () { if (running && secs > 0 && isSeason() || running && secs > 0 && S[cur].phase === 'setup') { secs--; paintClock(); } }, 1000);

  var themeBtn = document.getElementById('theme');
  themeBtn.onclick = function () {
    var dark = document.documentElement.dataset.theme !== 'dark';
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    themeBtn.textContent = dark ? '☀️ Mode clair' : '🌙 Mode sombre';
  };
  if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) themeBtn.click();
  sync();
})();
</script>
</body>
</html>
